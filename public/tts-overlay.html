<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex,nofollow,noarchive" />
<title>MinerBot Global Overlay</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.stage{position:fixed;inset:0;pointer-events:none}.media-layer,.tts-layer{position:absolute;inset:0;pointer-events:none}.media-item{position:absolute;transform-origin:center center;pointer-events:none}.media-item img,.media-item video{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}.badge{position:absolute;left:36px;bottom:36px;display:flex;align-items:center;gap:10px;background:rgba(10,12,15,.92);color:#fff;border:1px solid rgba(255,255,255,.13);border-radius:14px;padding:10px 14px 10px 10px;box-shadow:0 10px 32px rgba(0,0,0,.28);opacity:0;transform:translateY(12px) scale(.97);transition:opacity .2s ease,transform .2s ease}.badge.show{opacity:1;transform:translateY(0) scale(1)}.icon{width:30px;height:30px;border-radius:9px;background:#53fc18;color:#071006;display:grid;place-items:center}.icon svg{width:18px;height:18px;fill:currentColor}.icon svg path:nth-child(n+2){fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}.name{font-size:15px;font-weight:800;max-width:280px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bars{display:flex;align-items:center;gap:2px;height:14px;margin-left:2px}.bars i{width:2px;height:5px;background:#53fc18;border-radius:2px;animation:wave .65s ease-in-out infinite alternate}.bars i:nth-child(2){animation-delay:.15s}.bars i:nth-child(3){animation-delay:.3s}.bars i:nth-child(4){animation-delay:.08s}@keyframes wave{to{height:14px}}
</style>
</head>
<body>
<div class="stage">
  <div id="mediaLayer" class="media-layer"></div>
  <div class="tts-layer"><div id="badge" class="badge"><span class="icon"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16 8.5c1.2 1 1.8 2.1 1.8 3.5s-.6 2.5-1.8 3.5"/><path d="M18.5 6c2 1.7 3 3.7 3 6s-1 4.3-3 6"/></svg></span><span id="name" class="name">@usuario</span><span class="bars"><i></i><i></i><i></i><i></i></span></div></div>
</div>
<script>
const key=new URLSearchParams(location.search).get('key')||'';
const badge=document.getElementById('badge');const nameEl=document.getElementById('name');const mediaLayer=document.getElementById('mediaLayer');
let busy=false;const mediaNodes=new Map();

async function pollTts(){if(busy||!key)return;try{const r=await fetch(`/api/streambot/overlay/next?key=${encodeURIComponent(key)}`,{cache:'no-store'});if(!r.ok)return;const d=await r.json();if(d.item)playTts(d.item)}catch{}}
async function completeTts(id){try{await fetch(`/api/streambot/overlay/complete?key=${encodeURIComponent(key)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})})}catch{}}
async function playTts(item){busy=true;nameEl.textContent='@'+String(item.username||'viewer').replace(/^@/,'');badge.classList.add('show');const audio=new Audio(item.audioUrl);audio.volume=Math.max(0,Math.min(1,Number(item.volume??.85)));let ended=false;const finish=async()=>{if(ended)return;ended=true;badge.classList.remove('show');await completeTts(item.id);busy=false;setTimeout(pollTts,250)};audio.addEventListener('ended',finish,{once:true});audio.addEventListener('error',finish,{once:true});try{await audio.play()}catch{finish()}}

async function pollMedia(){if(!key)return;try{const r=await fetch(`/api/streambot/overlay/media-state?key=${encodeURIComponent(key)}`,{cache:'no-store'});if(!r.ok)return;const d=await r.json();syncMedia(d.items||[])}catch{}}
function syncMedia(items){
  const active=new Set(items.map(i=>String(i.id)));
  for(const [id,entry] of mediaNodes){if(!active.has(id)){entry.el.remove();mediaNodes.delete(id)}}
  for(const item of items){
    const id=String(item.id);let entry=mediaNodes.get(id);
    if(!entry){
      const el=document.createElement('div');el.className='media-item';el.dataset.id=id;
      const media=item.mediaType==='video'?document.createElement('video'):document.createElement('img');
      if(item.mediaType==='video'){media.playsInline=true;media.preload='auto';media.addEventListener('ended',()=>{const current=mediaNodes.get(id);if(current&&!current.item.loop)completeMedia(current.item)})}
      media.src=item.fileUrl;el.appendChild(media);mediaLayer.appendChild(el);entry={el,media,item:null,nonce:null};mediaNodes.set(id,entry)
    }
    entry.item=item;applyMediaStyle(entry,item);
    if(item.mediaType==='video'){
      entry.media.volume=Math.max(0,Math.min(1,Number(item.volume??1)));entry.media.loop=Boolean(item.loop);
      if(entry.nonce!==Number(item.playNonce)){entry.nonce=Number(item.playNonce);try{entry.media.currentTime=0}catch{};entry.media.play().catch(()=>{})}
    }
  }
}
function applyMediaStyle(entry,item){Object.assign(entry.el.style,{left:`${Number(item.x)*100}%`,top:`${Number(item.y)*100}%`,width:`${Number(item.width)*100}%`,height:`${Number(item.height)*100}%`,transform:`rotate(${Number(item.rotation)||0}deg)`,opacity:String(Math.max(0,Math.min(1,Number(item.opacity??1)))),zIndex:String(Number(item.zIndex)||0)})}
async function completeMedia(item){try{await fetch(`/api/streambot/overlay/media/complete?key=${encodeURIComponent(key)}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:item.id,playNonce:item.playNonce})})}catch{}}

setInterval(pollTts,900);setInterval(pollMedia,450);pollTts();pollMedia();
</script>
</body>
</html>
