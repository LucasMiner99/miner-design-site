<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Meta Subs Overlay</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zalando+Sans:ital,wght@0,200..900;1,200..900&display=swap');

*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
  color:#fff;
  font-family:'Zalando Sans',Arial,sans-serif;
}
body{display:grid;place-items:center}

.panel{
  width:min(calc(100% - 16px),580px);
  height:min(calc(100% - 16px),155px);
  padding:14px 20px 12px;
  display:grid;
  grid-template-rows:auto auto auto;
  background:linear-gradient(180deg,rgba(8,10,15,.98),rgba(5,7,11,.98));
  border:2px solid #717887;
  border-radius:10px;
  box-shadow:
    0 12px 30px rgba(0,0,0,.34),
    inset 0 1px 0 rgba(255,255,255,.025);
}

.head{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:22px;
  align-items:center;
}
.eyebrow{
  display:block;
  margin-bottom:5px;
  font-size:11px;
  line-height:1;
  font-weight:850;
  letter-spacing:.17em;
  text-transform:uppercase;
  color:#aab0bc;
}
.title{
  display:block;
  font-size:34px;
  line-height:.92;
  font-weight:900;
  letter-spacing:-.035em;
  color:#fff;
}
.count{
  align-self:center;
  font-size:40px;
  line-height:.9;
  font-weight:900;
  letter-spacing:-.025em;
  color:#fff;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}

.month{
  margin-top:9px;
  font-size:12px;
  line-height:1;
  font-weight:850;
  letter-spacing:.17em;
  text-transform:uppercase;
  color:#aab0bc;
}

.progress-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:12px;
  align-items:center;
  margin-top:7px;
}
.bar{
  position:relative;
  height:14px;
  overflow:hidden;
  border:1px solid #444a56;
  border-radius:999px;
  background:#1d2129;
  box-shadow:inset 0 1px 5px rgba(0,0,0,.45);
}
.fill{
  position:absolute;
  inset:0 auto 0 0;
  width:0;
  border-radius:999px;
  background:
    repeating-linear-gradient(135deg,rgba(255,255,255,.11) 0 9px,rgba(255,255,255,.02) 9px 18px),
    linear-gradient(90deg,#914cff 0%,#685cff 52%,#428bff 100%);
  box-shadow:0 0 16px rgba(96,83,255,.55);
  transition:width .35s ease;
}
.pct{
  min-width:58px;
  height:28px;
  display:grid;
  place-items:center;
  padding:0 10px;
  border:1px solid #3e4657;
  border-radius:8px;
  background:#11151d;
  font-size:18px;
  line-height:1;
  font-weight:900;
  letter-spacing:.01em;
  color:#fff;
  font-variant-numeric:tabular-nums;
}
</style>
</head>
<body>
<div id="panel" class="panel">
  <div class="head">
    <div>
      <span class="eyebrow">Meta mensual</span>
      <span class="title">Meta de subs</span>
    </div>
    <span id="count" class="count">0 / 50</span>
  </div>
  <div id="month" class="month">Meta mensual</div>
  <div class="progress-row">
    <div class="bar"><div id="fill" class="fill"></div></div>
    <span id="pct" class="pct">0%</span>
  </div>
</div>
<script>
const key=new URLSearchParams(location.search).get('key')||'',panel=document.getElementById('panel'),count=document.getElementById('count'),fill=document.getElementById('fill'),month=document.getElementById('month'),pct=document.getElementById('pct');let ws=null;
function monthName(k){const m=String(k||'').match(/^(\d{4})-(\d{2})$/),n=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];return m?n[Math.max(0,Math.min(11,Number(m[2])-1))]:'Meta mensual'}
async function poll(){if(!key)return;try{const r=await fetch(`/api/streambot/subgoal/state?key=${encodeURIComponent(key)}`,{cache:'no-store'});if(!r.ok)return;const d=await r.json();if(!d.enabled){panel.style.display='none';return}panel.style.display='grid';const cur=Math.max(0,Math.round(Number(d.current)||0)),target=Math.max(1,Math.round(Number(d.target)||1)),p=Math.max(0,Math.round(cur/target*100));count.textContent=`${cur} / ${target}`;fill.style.width=`${Math.min(100,p)}%`;month.textContent=monthName(d.month);pct.textContent=`${p}%`}catch{}}
function connect(){if(!key)return;const proto=location.protocol==='https:'?'wss':'ws';try{ws=new WebSocket(`${proto}://${location.host}/api/streambot/realtime/ws?role=overlay&key=${encodeURIComponent(key)}`)}catch{return}ws.addEventListener('open',poll);ws.addEventListener('message',e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='subgoal.refresh')poll()});ws.addEventListener('close',()=>setTimeout(connect,1800));ws.addEventListener('error',()=>{try{ws.close()}catch{}})}
setInterval(poll,20000);poll();connect();
</script>
</body>
</html>
