<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Meta Subs Overlay</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#fff;font-family:Georgia,"Times New Roman",serif}
body{display:grid;place-items:center}
.panel{position:relative;width:100%;height:100%;min-width:480px;min-height:240px;background:url("assets/overlay-wow-panel.png") center/100% 100% no-repeat;filter:drop-shadow(0 10px 18px rgba(0,0,0,.36));padding:8.6% 6.8% 8.5% 7.2%;display:flex;flex-direction:column}
.head{display:flex;align-items:center;gap:2.2%;min-width:0;min-height:34%}
.star{font-size:clamp(26px,3.8vw,38px);color:#ffe080;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.55))}
.title{font-size:clamp(26px,3.8vw,38px);font-weight:900;color:#efd091;text-shadow:0 2px 2px rgba(0,0,0,.9);flex:1;line-height:1}
.count{font-size:clamp(32px,4.7vw,52px);font-weight:900;color:#fff8df;text-shadow:0 2px 3px rgba(0,0,0,.95);font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1}
.bar-wrap{margin-top:2.2%;padding-right:1.8%}
.bar{height:clamp(13px,1.75vw,20px);background:rgba(14,8,3,.76);border-radius:999px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.75),0 0 0 1px rgba(245,214,137,.1)}
.fill{height:100%;width:0;background:linear-gradient(180deg,#ffe293,#c9962d);border-radius:999px;transition:width .35s ease}
.bottom{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;align-items:center;column-gap:7%;min-height:30%}
.month{font-family:Arial,Helvetica,sans-serif;font-size:clamp(20px,2.8vw,29px);font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:#e3cfa2;text-shadow:0 2px 2px rgba(0,0,0,.85)}
.meta{display:flex;justify-content:flex-end;align-items:flex-end}.pct{font-size:clamp(34px,5vw,54px);font-weight:900;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.95);font-variant-numeric:tabular-nums;line-height:1}
</style></head><body><div id="panel" class="panel"><div class="head"><span class="star">★</span><span class="title">Meta de subs</span><span id="count" class="count">0 / 50</span></div><div class="bar-wrap"><div class="bar"><div id="fill" class="fill"></div></div></div><div class="bottom"><span id="month" class="month">Meta mensual</span><div class="meta"><span id="pct" class="pct">0%</span></div></div></div>
<script>
const key=new URLSearchParams(location.search).get('key')||'',panel=document.getElementById('panel'),count=document.getElementById('count'),fill=document.getElementById('fill'),month=document.getElementById('month'),pct=document.getElementById('pct');let ws=null;
function monthName(k){const m=String(k||'').match(/^(\d{4})-(\d{2})$/),n=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];return m?n[Math.max(0,Math.min(11,Number(m[2])-1))]:'Meta mensual'}
async function poll(){if(!key)return;try{const r=await fetch(`/api/streambot/subgoal/state?key=${encodeURIComponent(key)}`,{cache:'no-store'});if(!r.ok)return;const d=await r.json();if(!d.enabled){panel.style.display='none';return}panel.style.display='flex';const cur=Math.max(0,Math.round(Number(d.current)||0)),target=Math.max(1,Math.round(Number(d.target)||1)),p=Math.max(0,Math.round(cur/target*100));count.textContent=`${cur} / ${target}`;fill.style.width=`${Math.min(100,p)}%`;month.textContent=monthName(d.month);pct.textContent=`${p}%`}catch{}}
function connect(){if(!key)return;const proto=location.protocol==='https:'?'wss':'ws';try{ws=new WebSocket(`${proto}://${location.host}/api/streambot/realtime/ws?role=overlay&key=${encodeURIComponent(key)}`)}catch{return}ws.addEventListener('open',poll);ws.addEventListener('message',e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='subgoal.refresh')poll()});ws.addEventListener('close',()=>setTimeout(connect,1800));ws.addEventListener('error',()=>{try{ws.close()}catch{}})}
setInterval(poll,20000);poll();connect();
</script></body></html>
