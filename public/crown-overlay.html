<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Corona Overlay</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#fff;font-family:Georgia,"Times New Roman",serif}
body{display:grid;place-items:center}.panel{position:relative;width:100%;height:100%;min-width:300px;min-height:100px;background:url("assets/overlay-wow-panel.png") center/100% 100% no-repeat;filter:drop-shadow(0 10px 18px rgba(0,0,0,.36));padding:clamp(20px,13vh,28px) clamp(36px,6.2vw,52px) clamp(18px,11vh,25px);display:flex;flex-direction:column;justify-content:center}.row{display:flex;align-items:center;gap:1.4vw;min-width:0}.crown{font-size:clamp(17px,3vw,28px);line-height:1}.label{font-size:clamp(16px,2.7vw,25px);font-weight:900;color:#efcf85;text-shadow:0 2px 2px #000}.name{font-size:clamp(21px,4vw,34px);font-weight:900;color:#fff8df;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;text-shadow:0 2px 2px #000}.held{font-size:clamp(16px,2.8vw,24px);font-weight:900;font-variant-numeric:tabular-nums;color:#fff;text-shadow:0 2px 2px #000;white-space:nowrap}.divider{height:1px;background:rgba(238,203,119,.18);margin:clamp(9px,5vh,13px) 0 clamp(7px,4vh,11px)}.bottom{display:flex;justify-content:space-between;align-items:center;gap:3vw;color:#ead9b0;font-family:Arial,sans-serif;font-size:clamp(13px,2.25vw,19px);font-weight:700;min-width:0}.bottom strong{color:#fff;font-weight:900}.hint{white-space:nowrap}.open .countdown strong{color:#ffe16b;text-shadow:0 0 9px rgba(255,205,68,.55)}
.alert{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:12%;font-size:clamp(22px,4vw,34px);font-weight:900;color:#fff5d7;text-shadow:0 2px 3px #000;background:rgba(30,15,4,.25)}.alert.show{display:grid}.topview{position:absolute;inset:0;padding:clamp(18px,10vh,24px) clamp(38px,7vw,58px) clamp(16px,9vh,22px);display:none;flex-direction:column;justify-content:center}.topview.show{display:flex}.top-title{text-align:center;color:#f2d28a;font-weight:900;font-size:clamp(18px,3.2vw,28px);margin-bottom:clamp(5px,3vh,8px)}.top-row{display:grid;grid-template-columns:2.1em 1fr auto;gap:.5em;align-items:center;padding:clamp(3px,1.7vh,5px) 0;font-family:Arial,sans-serif;font-size:clamp(12px,1.9vw,17px);font-weight:800;border-top:1px solid rgba(238,203,119,.11)}.top-row:first-of-type{border-top:0}.rank{color:#dab567}.time{font-variant-numeric:tabular-nums;color:#f1e2c0}.main.hidden{visibility:hidden}
</style></head><body>
<div id="panel" class="panel"><div id="main" class="main"><div class="row"><span class="crown">👑</span><span class="label">Rey</span><span id="king" class="name">Sin rey</span><span id="held" class="held">00:00:00</span></div><div class="divider"></div><div class="bottom"><span id="countdown" class="countdown">Corona libre</span><span id="hint" class="hint">Escribí <strong>!robar</strong></span></div></div><div id="alert" class="alert"></div><div id="top" class="topview"></div></div>
<script>
const key=new URLSearchParams(location.search).get('key')||'';const panel=document.getElementById('panel'),main=document.getElementById('main'),king=document.getElementById('king'),held=document.getElementById('held'),countdown=document.getElementById('countdown'),hint=document.getElementById('hint'),alertBox=document.getElementById('alert'),topBox=document.getElementById('top');let data=null,offset=0,ws=null,alertTimer=null,topTimer=null;
function now(){return Date.now()+offset}function fmt(ms,hours=true){const t=Math.max(0,Math.floor(Number(ms||0)/1000)),h=Math.floor(t/3600),m=Math.floor((t%3600)/60),s=t%60;if(!hours&&h===0)return`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;return`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function poll(){if(!key)return;try{const r=await fetch(`/api/streambot/crown/state?key=${encodeURIComponent(key)}`,{cache:'no-store'});if(!r.ok)return;data=await r.json();offset=Number(data.serverNow||Date.now())-Date.now();render()}catch{}}
function render(){if(!data||!data.enabled){panel.style.display='none';return}panel.style.display='flex';const st=data.state||{},n=now(),cmd=String(data.stealCommand||'robar').replace(/^!+/,'');hint.innerHTML=`Escribí <strong>!${esc(cmd)}</strong> cuando se abra`;panel.classList.remove('open');if(!st.currentUsername){king.textContent='Sin rey';held.textContent='';countdown.innerHTML='<strong>Corona libre</strong>';hint.innerHTML=`Escribí <strong>!${esc(cmd)}</strong> para reclamarla`;return}king.textContent=st.currentUsername;held.textContent=fmt(n-Number(st.crownedAt||n));const a=Number(st.stealOpenAt||0),b=Number(st.stealCloseAt||0);if(a&&n<a)countdown.innerHTML=`Se puede robar en <strong>${fmt(a-n,false)}</strong>`;else if(b&&n<b){panel.classList.add('open');countdown.innerHTML=`<strong>¡ROBA AHORA! ${fmt(b-n,false)}</strong>`}else countdown.textContent='Preparando próxima ventana…'}
function showAlert(m){clearTimeout(alertTimer);main.classList.add('hidden');topBox.classList.remove('show');alertBox.innerHTML=m.initial?`<b>${esc(m.username||'viewer')}</b><br>se quedó con la corona`:`<b>${esc(m.username||'viewer')}</b><br>robó la corona`;alertBox.classList.add('show');alertTimer=setTimeout(()=>{alertBox.classList.remove('show');main.classList.remove('hidden')},Math.max(1000,Number(m.durationMs||5000)))}
function showTop(m){clearTimeout(topTimer);alertBox.classList.remove('show');main.classList.add('hidden');const rows=(Array.isArray(m.top)?m.top:[]).slice(0,5);topBox.innerHTML=`<div class="top-title">👑 Top Reyes</div>${rows.map((r,i)=>`<div class="top-row"><span class="rank">${i+1}.</span><span>${esc(r.username)}${r.isCurrent?' 👑':''}</span><span class="time">${fmt(r.totalMs)}</span></div>`).join('')||'<div class="top-row"><span></span><span>Sin historial todavía.</span><span></span></div>'}`;topBox.classList.add('show');topTimer=setTimeout(()=>{topBox.classList.remove('show');main.classList.remove('hidden')},Math.max(1000,Number(m.durationMs||10000)))}
function connect(){if(!key)return;const proto=location.protocol==='https:'?'wss':'ws';try{ws=new WebSocket(`${proto}://${location.host}/api/streambot/realtime/ws?role=overlay&key=${encodeURIComponent(key)}`)}catch{return}ws.addEventListener('open',poll);ws.addEventListener('message',e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='crown.refresh')poll();else if(m.type==='crown.alert'){showAlert(m);poll()}else if(m.type==='crown.showTop')showTop(m)});ws.addEventListener('close',()=>setTimeout(connect,1800));ws.addEventListener('error',()=>{try{ws.close()}catch{}})}
setInterval(render,500);setInterval(poll,20000);poll();connect();
</script></body></html>
