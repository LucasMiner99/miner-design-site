<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Corona Overlay</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zalando+Sans:ital,wght@0,200..900;1,200..900&display=swap');

*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:transparent;
  color:#fff;
  font-family:'Zalando Sans',Arial,sans-serif;
}
body{display:grid;place-items:center}

.panel{
  position:relative;
  width:min(calc(100% - 12px),580px);
  height:min(calc(100% - 12px),242px);
  overflow:hidden;
  background:linear-gradient(180deg,rgba(8,10,15,.985),rgba(5,7,11,.985));
  border:2px solid #717887;
  border-radius:10px;
  box-shadow:
    0 12px 30px rgba(0,0,0,.36),
    inset 0 1px 0 rgba(255,255,255,.025);
}
.main{
  height:100%;
  display:grid;
  grid-template-rows:76px 1px minmax(0,1fr);
  padding:11px 16px 10px;
}

.top{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:14px;
  align-items:center;
  min-width:0;
}
.identity{
  min-width:0;
  display:flex;
  gap:11px;
  align-items:center;
}
.icon-tile{
  flex:0 0 40px;
  width:36px;
  height:36px;
  display:grid;
  place-items:center;
  border:1px solid #313846;
  border-radius:9px;
  background:linear-gradient(180deg,#141925,#0f131c);
  color:#fff;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.035);
}
.crown{
  font-size:18px;
  line-height:1;
  transform:translateY(-1px);
}
.eyebrow{
  display:block;
  margin-bottom:4px;
  font-size:12px;
  line-height:1;
  font-weight:850;
  letter-spacing:.17em;
  text-transform:uppercase;
  color:#aab0bc;
}
.name{
  display:block;
  max-width:100%;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:32px;
  line-height:.92;
  font-weight:900;
  letter-spacing:-.035em;
  color:#fff;
}
.time{
  align-self:center;
  font-size:31px;
  line-height:.9;
  font-weight:900;
  letter-spacing:-.02em;
  color:#fff;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.divider{background:#303641}

.bottom{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  padding-top:10px;
  min-height:0;
}
.bottom-left,
.bottom-right{
  min-width:0;
}
.bottom-left{
  display:grid;
  grid-template-columns:36px minmax(0,1fr);
  column-gap:9px;
  align-items:start;
}
.hourglass-tile{
  width:36px;
  height:36px;
  display:grid;
  place-items:center;
  margin-top:1px;
  border:1px solid #33405e;
  border-radius:9px;
  background:linear-gradient(180deg,#151a27,#10141d);
  color:#fff;
  font-size:18px;
  line-height:1;
}
.bottom-content{min-width:0}
.block-label{
  display:block;
  margin-bottom:6px;
  font-size:15px;
  line-height:1;
  font-weight:900;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:#d8dce5;
  white-space:nowrap;
}
.countdown-wrap{
  min-height:70px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:8px 10px 7px;
  border:1px solid #3a4262;
  border-radius:10px;
  background:linear-gradient(180deg,rgba(68,54,155,.14),rgba(19,22,34,.96));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.025);
  overflow:hidden;
}
.countdown{
  display:block;
  font-size:40px;
  line-height:.88;
  font-weight:900;
  letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;
  color:#fff;
  white-space:nowrap;
}
.bottom-right{
  padding-left:14px;
  border-left:1px solid #303641;
}
.hint-box{
  min-height:70px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:8px 12px;
  border:1px solid #303744;
  border-radius:10px;
  background:#10141c;
}
.hint{
  display:block;
  width:100%;
  text-align:center;
  font-size:24px;
  line-height:1.02;
  font-weight:800;
  letter-spacing:-.018em;
  color:#fff;
}
.hint strong{font-weight:950;color:#fff}

.panel.open{
  border-color:#7b6cff;
  box-shadow:
    0 12px 30px rgba(0,0,0,.36),
    0 0 20px rgba(91,75,255,.16),
    inset 0 1px 0 rgba(255,255,255,.03);
}
.panel.open .countdown-wrap{
  border-color:#6b59ff;
  background:linear-gradient(180deg,rgba(91,67,219,.22),rgba(18,21,34,.97));
  box-shadow:0 0 16px rgba(91,75,255,.22),inset 0 1px 0 rgba(255,255,255,.035);
}
.panel.open .countdown{font-size:26px;font-weight:950;letter-spacing:-.012em}

.alert,.topview{
  position:absolute;
  inset:0;
  background:rgba(6,8,13,.99);
  display:none;
}
.alert.show{
  display:grid;
  place-items:center;
  padding:30px;
  text-align:center;
  font-size:32px;
  line-height:1.06;
  font-weight:850;
}
.alert b{font-weight:950}
.topview.show{
  display:flex;
  flex-direction:column;
  padding:14px 18px;
}
.top-title{
  font-size:18px;
  line-height:1;
  font-weight:900;
  margin-bottom:8px;
}
.top-row{
  display:grid;
  grid-template-columns:24px minmax(0,1fr) auto;
  gap:8px;
  align-items:center;
  padding:6px 0;
  border-top:1px solid #292e38;
  font-size:14px;
  font-weight:750;
}
.top-row:first-of-type{border-top:0}
.rank{color:#969daa}
.row-time{font-variant-numeric:tabular-nums;color:#fff}
.main.hidden{visibility:hidden}

@media (max-width:520px){
  .main{padding-left:14px;padding-right:16px}
  .top{gap:12px}
  .icon-tile{width:46px;height:46px;flex-basis:46px}
  .name{font-size:36px}
  .time{font-size:34px}
  .bottom{gap:14px}
  .bottom-right{padding-left:14px}
  .block-label{font-size:14px}
  .countdown{font-size:40px}
  .hint{font-size:24px}
}
</style>
</head>
<body>
<div id="panel" class="panel">
  <div id="main" class="main">
    <div class="top">
      <div class="identity">
        <span class="icon-tile crown">♛</span>
        <div>
          <span class="eyebrow">Rey</span>
          <span id="king" class="name">Sin rey</span>
        </div>
      </div>
      <span id="held" class="time">00:00:00</span>
    </div>

    <div class="divider"></div>

    <div class="bottom">
      <div class="bottom-left">
        <span class="hourglass-tile">⌛</span>
        <div class="bottom-content">
          <span class="block-label">Se puede robar en</span>
          <div class="countdown-wrap"><span id="countdown" class="countdown">00:00</span></div>
        </div>
      </div>

      <div class="bottom-right">
        <span class="block-label">Cómo robar</span>
        <div class="hint-box"><span id="hint" class="hint">Escribí <strong>!robar</strong><br>cuando se abra</span></div>
      </div>
    </div>
  </div>

  <div id="alert" class="alert"></div>
  <div id="top" class="topview"></div>
</div>
<script>
const key=new URLSearchParams(location.search).get('key')||'';const panel=document.getElementById('panel'),main=document.getElementById('main'),king=document.getElementById('king'),held=document.getElementById('held'),countdown=document.getElementById('countdown'),hint=document.getElementById('hint'),alertBox=document.getElementById('alert'),topBox=document.getElementById('top');let data=null,offset=0,ws=null,alertTimer=null,topTimer=null;
function now(){return Date.now()+offset}function fmt(ms,hours=true){const t=Math.max(0,Math.floor(Number(ms||0)/1000)),h=Math.floor(t/3600),m=Math.floor((t%3600)/60),s=t%60;if(!hours&&h===0)return`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;return`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function poll(){if(!key)return;try{const r=await fetch(`/api/streambot/crown/state?key=${encodeURIComponent(key)}`,{cache:'no-store'});if(!r.ok)return;data=await r.json();offset=Number(data.serverNow||Date.now())-Date.now();render()}catch{}}
function render(){if(!data||!data.enabled){panel.style.display='none';return}panel.style.display='block';const st=data.state||{},n=now(),cmd=String(data.stealCommand||'robar').replace(/^!+/,'');hint.innerHTML=`Escribí <strong>!${esc(cmd)}</strong><br>cuando se abra`;panel.classList.remove('open');if(!st.currentUsername){king.textContent='Sin rey';held.textContent='--:--:--';countdown.textContent='LIBRE';hint.innerHTML=`Escribí <strong>!${esc(cmd)}</strong><br>para reclamarla`;return}king.textContent=st.currentUsername;held.textContent=fmt(n-Number(st.crownedAt||n));const a=Number(st.stealOpenAt||0),b=Number(st.stealCloseAt||0);if(a&&n<a)countdown.textContent=fmt(a-n,false);else if(b&&n<b){panel.classList.add('open');countdown.textContent=`ROBAR ${fmt(b-n,false)}`}else countdown.textContent='--:--'}
function showAlert(m){clearTimeout(alertTimer);main.classList.add('hidden');topBox.classList.remove('show');alertBox.innerHTML=m.initial?`<b>${esc(m.username||'viewer')}</b><br>se quedó con la corona`:`<b>${esc(m.username||'viewer')}</b><br>robó la corona`;alertBox.classList.add('show');alertTimer=setTimeout(()=>{alertBox.classList.remove('show');main.classList.remove('hidden')},Math.max(1000,Number(m.durationMs||5000)))}
function showTop(m){clearTimeout(topTimer);alertBox.classList.remove('show');main.classList.add('hidden');const rows=(Array.isArray(m.top)?m.top:[]).slice(0,5);topBox.innerHTML=`<div class="top-title">Top Reyes</div>${rows.map((r,i)=>`<div class="top-row"><span class="rank">${i+1}</span><span>${esc(r.username)}</span><span class="row-time">${fmt(r.totalMs)}</span></div>`).join('')||'<div class="top-row"><span></span><span>Sin historial todavía.</span><span></span></div>'}`;topBox.classList.add('show');topTimer=setTimeout(()=>{topBox.classList.remove('show');main.classList.remove('hidden')},Math.max(1000,Number(m.durationMs||10000)))}
function connect(){if(!key)return;const proto=location.protocol==='https:'?'wss':'ws';try{ws=new WebSocket(`${proto}://${location.host}/api/streambot/realtime/ws?role=overlay&key=${encodeURIComponent(key)}`)}catch{return}ws.addEventListener('open',poll);ws.addEventListener('message',e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='crown.refresh')poll();else if(m.type==='crown.alert'){showAlert(m);poll()}else if(m.type==='crown.showTop')showTop(m)});ws.addEventListener('close',()=>setTimeout(connect,1800));ws.addEventListener('error',()=>{try{ws.close()}catch{}})}
setInterval(render,500);setInterval(poll,20000);poll();connect();
</script>
</body>
</html>
