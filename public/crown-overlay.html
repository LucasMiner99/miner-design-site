<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Corona Overlay</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#fff;font-family:Georgia,"Times New Roman",serif}
body{display:grid;place-items:center}
.panel{position:relative;width:100%;height:100%;min-width:480px;min-height:240px;background:url("assets/overlay-wow-panel.png") center/100% 100% no-repeat;filter:drop-shadow(0 10px 18px rgba(0,0,0,.36))}
.layer{position:absolute;inset:0}
.main,.topview{padding:8.5% 6.6% 8.2% 7.2%;display:flex;flex-direction:column}
.toprow{display:grid;grid-template-columns:minmax(0,1fr) 29%;column-gap:2.5%;align-items:center;min-height:44%}
.kingwrap{display:flex;align-items:center;gap:2.6%;min-width:0}
.crown{font-size:clamp(28px,4.2vw,42px);line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.55))}
.textwrap{min-width:0;display:flex;flex-direction:column;justify-content:center}
.label{font-size:clamp(20px,3vw,29px);font-weight:900;line-height:1;color:#efd191;text-shadow:0 2px 2px rgba(0,0,0,.85)}
.name{font-size:clamp(42px,6vw,64px);font-weight:900;line-height:.94;color:#fff8df;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 2px 3px rgba(0,0,0,.95);margin-top:.08em}
.timerbox{display:flex;align-items:center;justify-content:center;align-self:stretch;min-height:72%;padding:0 7%;font-size:clamp(34px,5.1vw,58px);font-weight:900;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.95);font-variant-numeric:tabular-nums;white-space:nowrap}
.bottom{margin-top:auto;display:grid;grid-template-columns:1fr 1fr;column-gap:7%;align-items:center;min-height:28%}
.bottom-left,.bottom-right{display:flex;flex-direction:column;justify-content:center;min-width:0}
.bottom-title{font-family:Arial,Helvetica,sans-serif;font-size:clamp(21px,3vw,29px);font-weight:800;line-height:1.05;color:#f3e2bd;text-shadow:0 2px 2px rgba(0,0,0,.85)}
.bottom-strong{font-size:clamp(46px,6.2vw,68px);line-height:.95;margin-top:.03em;font-weight:900;color:#fff;text-shadow:0 2px 3px rgba(0,0,0,.95);font-variant-numeric:tabular-nums;white-space:nowrap}
.bottom-right{padding-left:12%}
.hint{font-family:Arial,Helvetica,sans-serif;font-size:clamp(19px,2.75vw,27px);font-weight:700;line-height:1.06;color:#e7d4ac;text-shadow:0 2px 2px rgba(0,0,0,.85)}
.hint strong{font-size:1.18em;color:#fff;font-weight:900}
.panel.open .bottom-strong{color:#ffe46d;text-shadow:0 0 12px rgba(255,210,77,.5),0 2px 3px rgba(0,0,0,.95)}
.alert{position:absolute;inset:0;display:none;place-items:center;text-align:center;padding:18% 12%;font-size:clamp(30px,4.2vw,50px);line-height:1.05;font-weight:900;color:#fff5d7;text-shadow:0 2px 3px rgba(0,0,0,.95);background:rgba(23,12,4,.16)}
.alert b{color:#fff}.alert.show{display:grid}
.topview{display:none;justify-content:center}.topview.show{display:flex}
.top-title{text-align:center;color:#f2d28a;font-weight:900;font-size:clamp(26px,3.6vw,38px);text-shadow:0 2px 2px rgba(0,0,0,.9);margin-bottom:2.4%}
.top-row{display:grid;grid-template-columns:2.2em 1fr auto;gap:.6em;align-items:center;padding:.38em 0;font-family:Arial,Helvetica,sans-serif;font-size:clamp(18px,2.3vw,24px);font-weight:800;border-top:1px solid rgba(238,203,119,.12);color:#f4e7c8;text-shadow:0 2px 2px rgba(0,0,0,.8)}
.top-row:first-of-type{border-top:0}.rank{color:#dab567}.time{font-variant-numeric:tabular-nums;color:#fff8df;white-space:nowrap}.main.hidden{visibility:hidden}
</style></head><body>
<div id="panel" class="panel"><div id="main" class="main layer"><div class="toprow"><div class="kingwrap"><span class="crown">👑</span><div class="textwrap"><span class="label">Rey</span><span id="king" class="name">Sin rey</span></div></div><div id="held" class="timerbox">00:00:00</div></div><div class="bottom"><div class="bottom-left"><span class="bottom-title">Se puede robar en</span><span id="countdown" class="bottom-strong">00:00</span></div><div class="bottom-right"><span id="hint" class="hint">Escribí <strong>!robar</strong><br>cuando se abra</span></div></div></div><div id="alert" class="alert"></div><div id="top" class="topview layer"></div></div>
<script>
const key=new URLSearchParams(location.search).get('key')||'';const panel=document.getElementById('panel'),main=document.getElementById('main'),king=document.getElementById('king'),held=document.getElementById('held'),countdown=document.getElementById('countdown'),hint=document.getElementById('hint'),alertBox=document.getElementById('alert'),topBox=document.getElementById('top');let data=null,offset=0,ws=null,alertTimer=null,topTimer=null;
function now(){return Date.now()+offset}function fmt(ms,hours=true){const t=Math.max(0,Math.floor(Number(ms||0)/1000)),h=Math.floor(t/3600),m=Math.floor((t%3600)/60),s=t%60;if(!hours&&h===0)return`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;return`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function poll(){if(!key)return;try{const r=await fetch(`/api/streambot/crown/state?key=${encodeURIComponent(key)}`,{cache:'no-store'});if(!r.ok)return;data=await r.json();offset=Number(data.serverNow||Date.now())-Date.now();render()}catch{}}
function render(){if(!data||!data.enabled){panel.style.display='none';return}panel.style.display='block';const st=data.state||{},n=now(),cmd=String(data.stealCommand||'robar').replace(/^!+/,'');hint.innerHTML=`Escribí <strong>!${esc(cmd)}</strong><br>cuando se abra`;panel.classList.remove('open');if(!st.currentUsername){king.textContent='Sin rey';held.textContent='--:--:--';countdown.innerHTML='Corona libre';hint.innerHTML=`Escribí <strong>!${esc(cmd)}</strong><br>para reclamarla`;return}king.textContent=st.currentUsername;held.textContent=fmt(n-Number(st.crownedAt||n));const a=Number(st.stealOpenAt||0),b=Number(st.stealCloseAt||0);if(a&&n<a)countdown.textContent=fmt(a-n,false);else if(b&&n<b){panel.classList.add('open');countdown.textContent=fmt(b-n,false)}else countdown.textContent='--:--'}
function showAlert(m){clearTimeout(alertTimer);main.classList.add('hidden');topBox.classList.remove('show');alertBox.innerHTML=m.initial?`<b>${esc(m.username||'viewer')}</b><br>se quedó con la corona`:`<b>${esc(m.username||'viewer')}</b><br>robó la corona`;alertBox.classList.add('show');alertTimer=setTimeout(()=>{alertBox.classList.remove('show');main.classList.remove('hidden')},Math.max(1000,Number(m.durationMs||5000)))}
function showTop(m){clearTimeout(topTimer);alertBox.classList.remove('show');main.classList.add('hidden');const rows=(Array.isArray(m.top)?m.top:[]).slice(0,5);topBox.innerHTML=`<div class="top-title">👑 Top Reyes</div>${rows.map((r,i)=>`<div class="top-row"><span class="rank">${i+1}.</span><span>${esc(r.username)}${r.isCurrent?' 👑':''}</span><span class="time">${fmt(r.totalMs)}</span></div>`).join('')||'<div class="top-row"><span></span><span>Sin historial todavía.</span><span></span></div>'}`;topBox.classList.add('show');topTimer=setTimeout(()=>{topBox.classList.remove('show');main.classList.remove('hidden')},Math.max(1000,Number(m.durationMs||10000)))}
function connect(){if(!key)return;const proto=location.protocol==='https:'?'wss':'ws';try{ws=new WebSocket(`${proto}://${location.host}/api/streambot/realtime/ws?role=overlay&key=${encodeURIComponent(key)}`)}catch{return}ws.addEventListener('open',poll);ws.addEventListener('message',e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='crown.refresh')poll();else if(m.type==='crown.alert'){showAlert(m);poll()}else if(m.type==='crown.showTop')showTop(m)});ws.addEventListener('close',()=>setTimeout(connect,1800));ws.addEventListener('error',()=>{try{ws.close()}catch{}})}
setInterval(render,500);setInterval(poll,20000);poll();connect();
</script></body></html>
