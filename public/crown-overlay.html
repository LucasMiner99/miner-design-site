<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Corona Overlay</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Zalando+Sans:ital,wght@0,200..900;1,200..900&display=swap');
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:#fff;font-family:'Zalando Sans',Arial,sans-serif}
body{display:grid;place-items:center}
.panel{position:relative;width:100%;height:100%;min-width:520px;min-height:180px;background:rgba(6,7,9,.96);border:2px solid #666b74;border-radius:8px;box-shadow:0 10px 28px rgba(0,0,0,.32);overflow:hidden}
.main{height:100%;display:flex;flex-direction:column;padding:22px 26px 20px}
.top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:14px;min-width:0}
.crown{font-size:25px;line-height:1;color:#fff;font-family:Georgia,serif}
.identity{min-width:0}.eyebrow{display:block;font-size:11px;line-height:1;color:#90959e;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin-bottom:5px}.name{display:block;font-size:31px;line-height:1;font-weight:850;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.time{font-size:27px;line-height:1;font-weight:850;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:.02em}
.bottom{margin-top:auto;padding-top:17px;border-top:1px solid #343840;display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:end}
.block-label{display:block;font-size:10px;line-height:1;color:#858b94;font-weight:800;letter-spacing:.11em;text-transform:uppercase;margin-bottom:7px}.countdown{display:block;font-size:25px;line-height:1;font-weight:850;font-variant-numeric:tabular-nums;color:#fff;white-space:nowrap}.hint{font-size:14px;line-height:1.18;font-weight:650;color:#d9dce1}.hint strong{font-weight:900;color:#fff}.bottom-right{text-align:right}
.panel.open{border-color:#9499a2}.panel.open .countdown{font-weight:900}
.alert,.topview{position:absolute;inset:0;background:rgba(6,7,9,.98);display:none}.alert.show{display:grid;place-items:center;padding:30px;text-align:center;font-size:29px;line-height:1.08;font-weight:850}.alert b{font-weight:900}.topview.show{display:flex;flex-direction:column;padding:20px 26px}.top-title{font-size:16px;font-weight:850;margin-bottom:10px}.top-row{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid #292d34;font-size:14px;font-weight:700}.top-row:first-of-type{border-top:0}.rank{color:#8d939d}.row-time{font-variant-numeric:tabular-nums;color:#fff}.main.hidden{visibility:hidden}
</style>
</head>
<body>
<div id="panel" class="panel">
  <div id="main" class="main">
    <div class="top">
      <span class="crown">♛</span>
      <div class="identity"><span class="eyebrow">Rey</span><span id="king" class="name">Sin rey</span></div>
      <span id="held" class="time">00:00:00</span>
    </div>
    <div class="bottom">
      <div><span class="block-label">Se puede robar en</span><span id="countdown" class="countdown">00:00</span></div>
      <div class="bottom-right"><span class="block-label">Cómo robar</span><span id="hint" class="hint">Escribí <strong>!robar</strong> cuando se abra</span></div>
    </div>
  </div>
  <div id="alert" class="alert"></div>
  <div id="top" class="topview"></div>
</div>
<script>
const key=new URLSearchParams(location.search).get('key')||'';const panel=document.getElementById('panel'),main=document.getElementById('main'),king=document.getElementById('king'),held=document.getElementById('held'),countdown=document.getElementById('countdown'),hint=document.getElementById('hint'),alertBox=document.getElementById('alert'),topBox=document.getElementById('top');let data=null,offset=0,ws=null,alertTimer=null,topTimer=null;
function now(){return Date.now()+offset}function fmt(ms,hours=true){const t=Math.max(0,Math.floor(Number(ms||0)/1000)),h=Math.floor(t/3600),m=Math.floor((t%3600)/60),s=t%60;if(!hours&&h===0)return`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;return`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function poll(){if(!key)return;try{const r=await fetch(`/api/streambot/crown/state?key=${encodeURIComponent(key)}`,{cache:'no-store'});if(!r.ok)return;data=await r.json();offset=Number(data.serverNow||Date.now())-Date.now();render()}catch{}}
function render(){if(!data||!data.enabled){panel.style.display='none';return}panel.style.display='block';const st=data.state||{},n=now(),cmd=String(data.stealCommand||'robar').replace(/^!+/,'');hint.innerHTML=`Escribí <strong>!${esc(cmd)}</strong> cuando se abra`;panel.classList.remove('open');if(!st.currentUsername){king.textContent='Sin rey';held.textContent='--:--:--';countdown.textContent='LIBRE';hint.innerHTML=`Escribí <strong>!${esc(cmd)}</strong> para reclamarla`;return}king.textContent=st.currentUsername;held.textContent=fmt(n-Number(st.crownedAt||n));const a=Number(st.stealOpenAt||0),b=Number(st.stealCloseAt||0);if(a&&n<a)countdown.textContent=fmt(a-n,false);else if(b&&n<b){panel.classList.add('open');countdown.textContent=`ABIERTO ${fmt(b-n,false)}`}else countdown.textContent='--:--'}
function showAlert(m){clearTimeout(alertTimer);main.classList.add('hidden');topBox.classList.remove('show');alertBox.innerHTML=m.initial?`<b>${esc(m.username||'viewer')}</b><br>se quedó con la corona`:`<b>${esc(m.username||'viewer')}</b><br>robó la corona`;alertBox.classList.add('show');alertTimer=setTimeout(()=>{alertBox.classList.remove('show');main.classList.remove('hidden')},Math.max(1000,Number(m.durationMs||5000)))}
function showTop(m){clearTimeout(topTimer);alertBox.classList.remove('show');main.classList.add('hidden');const rows=(Array.isArray(m.top)?m.top:[]).slice(0,5);topBox.innerHTML=`<div class="top-title">Top Reyes</div>${rows.map((r,i)=>`<div class="top-row"><span class="rank">${i+1}</span><span>${esc(r.username)}</span><span class="row-time">${fmt(r.totalMs)}</span></div>`).join('')||'<div class="top-row"><span></span><span>Sin historial todavía.</span><span></span></div>'}`;topBox.classList.add('show');topTimer=setTimeout(()=>{topBox.classList.remove('show');main.classList.remove('hidden')},Math.max(1000,Number(m.durationMs||10000)))}
function connect(){if(!key)return;const proto=location.protocol==='https:'?'wss':'ws';try{ws=new WebSocket(`${proto}://${location.host}/api/streambot/realtime/ws?role=overlay&key=${encodeURIComponent(key)}`)}catch{return}ws.addEventListener('open',poll);ws.addEventListener('message',e=>{let m;try{m=JSON.parse(e.data)}catch{return}if(m.type==='crown.refresh')poll();else if(m.type==='crown.alert'){showAlert(m);poll()}else if(m.type==='crown.showTop')showTop(m)});ws.addEventListener('close',()=>setTimeout(connect,1800));ws.addEventListener('error',()=>{try{ws.close()}catch{}})}
setInterval(render,500);setInterval(poll,20000);poll();connect();
</script>
</body></html>
